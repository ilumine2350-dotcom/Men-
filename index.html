<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chick & Chips - Menú Digital para Mesas</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- QR Code Generator Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        :root {
            --primary: #FF5232;
            --primary-hover: #E03E20;
            --secondary: #FFB800;
            --dark-bg: #121212;
            --card-bg: #1E1E1E;
            --card-hover: #262626;
            --text-light: #F5F5F5;
            --text-muted: #AAAAAA;
            --border-color: #333333;
            --whatsapp-color: #25D366;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--dark-bg);
            color: var(--text-light);
            padding-bottom: 90px;
        }

        /* HEADER */
        header {
            position: sticky;
            top: 0;
            background-color: rgba(18, 18, 18, 0.95);
            backdrop-filter: blur(10px);
            z-index: 100;
            border-bottom: 1px solid var(--border-color);
            padding: 12px 16px;
        }

        .header-container {
            max-width: 600px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-img {
            width: 45px;
            height: 45px;
            object-fit: contain;
            border-radius: 8px;
        }

        .brand-text h1 {
            font-size: 1.1rem;
            font-weight: 800;
            color: var(--primary);
            line-height: 1.1;
            text-transform: uppercase;
        }

        .brand-text span {
            font-size: 0.7rem;
            color: var(--secondary);
            font-weight: 600;
        }

        .header-actions {
            display: flex;
            gap: 8px;
        }

        .icon-btn {
            position: relative;
            background: #252525;
            border: 1px solid var(--border-color);
            color: var(--text-light);
            width: 42px;
            height: 42px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: 0.2s;
            font-size: 1.1rem;
        }

        .icon-btn:hover {
            background: var(--primary);
        }

        .cart-badge {
            position: absolute;
            top: -4px;
            right: -4px;
            background: var(--primary);
            color: white;
            font-size: 0.7rem;
            font-weight: bold;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid var(--dark-bg);
        }

        /* TABLE SELECTOR BAR */
        .table-bar {
            max-width: 600px;
            margin: 12px auto 0 auto;
            padding: 0 16px;
        }

        .table-card {
            background: linear-gradient(135deg, rgba(255,82,50,0.15) 0%, rgba(30,30,30,1) 100%);
            border: 1px solid var(--primary);
            border-radius: 12px;
            padding: 10px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .table-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .table-number-tag {
            background: var(--primary);
            color: white;
            padding: 4px 12px;
            border-radius: 8px;
            font-weight: 800;
            font-size: 0.95rem;
        }

        .table-label {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .btn-change-table {
            background: none;
            border: 1px solid var(--border-color);
            color: var(--secondary);
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
        }

        /* CATEGORIES NAV */
        .categories-nav {
            max-width: 600px;
            margin: 15px auto;
            padding: 0 16px;
            display: flex;
            gap: 8px;
            overflow-x: auto;
            scrollbar-width: none;
        }

        .categories-nav::-webkit-scrollbar {
            display: none;
        }

        .cat-btn {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-light);
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            white-space: nowrap;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .cat-btn.active, .cat-btn:hover {
            background: var(--primary);
            border-color: var(--primary);
            color: white;
        }

        /* MENU GRID */
        main {
            max-width: 600px;
            margin: 0 auto;
            padding: 0 16px;
        }

        .menu-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .product-item {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
        }

        .product-details {
            flex: 1;
        }

        .product-header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 4px;
        }

        .product-title {
            font-size: 1rem;
            font-weight: 700;
            color: white;
        }

        .product-badge {
            font-size: 0.6rem;
            background: rgba(255, 184, 0, 0.15);
            color: var(--secondary);
            padding: 2px 6px;
            border-radius: 6px;
            font-weight: 600;
            border: 1px solid rgba(255, 184, 0, 0.3);
        }

        .product-desc {
            font-size: 0.8rem;
            color: var(--text-muted);
            line-height: 1.3;
            margin-bottom: 8px;
        }

        .product-price {
            font-size: 1.1rem;
            font-weight: 800;
            color: var(--secondary);
        }

        .add-btn {
            background-color: var(--primary);
            color: white;
            border: none;
            width: 38px;
            height: 38px;
            border-radius: 10px;
            font-size: 1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s, transform 0.1s;
        }

        .add-btn:active {
            transform: scale(0.92);
        }

        /* MODALES GENERALES */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(5px);
            z-index: 1000;
            display: none;
            justify-content: center;
            align-items: flex-end;
        }

        .modal-overlay.open {
            display: flex;
        }

        .drawer-content {
            width: 100%;
            max-width: 500px;
            max-height: 90vh;
            background-color: var(--dark-bg);
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            animation: slideUp 0.3s ease-out;
        }

        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }

        .drawer-header {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .drawer-header h3 {
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .close-modal {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 1.2rem;
            cursor: pointer;
        }

        .drawer-body {
            padding: 20px;
            overflow-y: auto;
            flex: 1;
        }

        .cart-empty {
            text-align: center;
            padding: 30px 0;
            color: var(--text-muted);
        }

        .cart-empty i {
            font-size: 2.5rem;
            margin-bottom: 10px;
            opacity: 0.5;
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid var(--border-color);
        }

        .cart-item-info h4 {
            font-size: 0.9rem;
            margin-bottom: 2px;
        }

        .cart-item-info span {
            font-size: 0.85rem;
            color: var(--secondary);
            font-weight: 600;
        }

        .qty-controls {
            display: flex;
            align-items: center;
            gap: 10px;
            background: var(--card-bg);
            padding: 4px 10px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        .qty-btn {
            background: none;
            border: none;
            color: white;
            font-size: 1rem;
            cursor: pointer;
            font-weight: bold;
        }

        .drawer-footer {
            padding: 16px 20px;
            border-top: 1px solid var(--border-color);
            background-color: var(--card-bg);
        }

        .form-group {
            margin-bottom: 12px;
        }

        .form-group label {
            display: block;
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-bottom: 4px;
        }

        .form-control {
            width: 100%;
            background: var(--dark-bg);
            border: 1px solid var(--border-color);
            color: white;
            padding: 10px 12px;
            border-radius: 8px;
            font-size: 0.85rem;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--primary);
        }

        .total-row {
            display: flex;
            justify-content: space-between;
            font-size: 1.1rem;
            font-weight: 800;
            margin: 12px 0;
        }

        .btn-send-order {
            width: 100%;
            background-color: var(--whatsapp-color);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        /* FLOATING BAR */
        .floating-bar {
            position: fixed;
            bottom: 15px;
            left: 16px;
            right: 16px;
            max-width: 560px;
            margin: 0 auto;
            background: var(--primary);
            color: white;
            padding: 12px 20px;
            border-radius: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 10px 20px rgba(255, 82, 50, 0.4);
            cursor: pointer;
            z-index: 90;
            transform: translateY(100px);
            transition: transform 0.3s ease;
        }

        .floating-bar.visible {
            transform: translateY(0);
        }

        /* QR GENERATOR MODAL */
        .qr-card-print {
            background: white;
            color: black;
            padding: 20px;
            border-radius: 16px;
            text-align: center;
            margin-top: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .qr-card-print h2 {
            font-size: 1.2rem;
            color: #111;
        }

        .qr-card-print p {
            font-size: 0.8rem;
            color: #555;
        }

        #qrcode canvas, #qrcode img {
            margin: 0 auto;
        }

        .print-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            width: 100%;
        }

        @media print {
            body * {
                visibility: hidden;
            }
            #printableQR, #printableQR * {
                visibility: visible;
            }
            #printableQR {
                position: absolute;
                left: 0;
                top: 0;
                width: 100%;
            }
        }
    </style>
</head>
<body>

    <!-- HEADER -->
    <header>
        <div class="header-container">
            <div class="brand">
                <img src="./logo.png" alt="Chick & Chips Logo" class="logo-img" onerror="this.onerror=null; this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'45\' height=\'45\' viewBox=\'0 0 100 100\'><rect width=\'100\' height=\'100\' fill=\'%23FF5232\' rx=\'15\'/><text x=\'50%\' y=\'55%\' dominant-baseline=\'middle\' text-anchor=\'middle\' fill=\'white\' font-size=\'35\' font-weight=\'bold\'>C&C</text></svg>';">
                <div class="brand-text">
                    <h1>Chick & Chips</h1>
                    <span>Menú para Mesas</span>
                </div>
            </div>
            <div class="header-actions">
                <button class="icon-btn" onclick="openAuthModal()" title="Generar QR de Mesas (Administración)">
                    <i class="fa-solid fa-qrcode"></i>
                </button>
                <button class="icon-btn" onclick="toggleCart()" title="Ver Pedido">
                    <i class="fa-solid fa-utensils"></i>
                    <div class="cart-badge" id="cartBadge">0</div>
                </button>
            </div>
        </div>
    </header>

    <!-- INDICADOR DE MESA -->
    <div class="table-bar">
        <div class="table-card">
            <div class="table-info">
                <span class="table-label">Estás pidiendo en:</span>
                <span class="table-number-tag" id="currentTableDisplay">Mesa 1</span>
            </div>
            <button class="btn-change-table" onclick="openTableSelector()">Cambiar</button>
        </div>
    </div>

    <!-- CATEGORÍAS -->
    <nav class="categories-nav">
        <button class="cat-btn active" onclick="filterMenu('todos', this)">🔥 Todos</button>
        <button class="cat-btn" onclick="filterMenu('papipollo', this)">🍗 Papipollo</button>
        <button class="cat-btn" onclick="filterMenu('salchipapa', this)">🍟 Salchipapa</button>
        <button class="cat-btn" onclick="filterMenu('hamburguesa', this)">🍔 Hamburguesa</button>
        <button class="cat-btn" onclick="filterMenu('bebidas', this)">🥤 Bebidas</button>
    </nav>

    <!-- MENÚ -->
    <main>
        <div class="menu-list" id="menuGrid">
            <!-- Productos renderizados aquí -->
        </div>
    </main>

    <!-- BARRA FLOTANTE CARRITO -->
    <div class="floating-bar" id="floatingCart" onclick="toggleCart()">
        <div style="display: flex; align-items: center; gap: 8px; font-weight: 700;">
            <i class="fa-solid fa-basket-shopping"></i>
            <span id="floatCount">0 items</span>
        </div>
        <div style="font-weight: 800;" id="floatTotal">$0.00</div>
    </div>

    <!-- MODAL AUTENTICACIÓN / PIN -->
    <div class="modal-overlay" id="authModal">
        <div class="drawer-content">
            <div class="drawer-header">
                <h3><i class="fa-solid fa-lock" style="color: var(--primary);"></i> Acceso Administrador</h3>
                <button class="close-modal" onclick="closeAuthModal()"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="drawer-body">
                <div class="form-group">
                    <label>Ingresa el código de acceso (PIN):</label>
                    <input type="password" id="pinInput" class="form-control" placeholder="••••" maxlength="6" style="font-size: 1.2rem; text-align: center; letter-spacing: 4px;">
                </div>
                <div id="pinError" style="color: #ff4d4d; font-size: 0.8rem; display: none; margin-bottom: 10px; text-align: center;">
                    ⚠️ Código incorrecto. Intenta nuevamente.
                </div>
                <button class="print-btn" onclick="verifyPin()">Ingresar</button>
            </div>
        </div>
    </div>

    <!-- MODAL CARRITO / ENVIAR A COCINA -->
    <div class="modal-overlay" id="cartModal">
        <div class="drawer-content">
            <div class="drawer-header">
                <h3><i class="fa-solid fa-receipt" style="color: var(--primary);"></i> Pedido para <span id="cartModalTable" style="color: var(--secondary);">Mesa 1</span></h3>
                <button class="close-modal" onclick="toggleCart()"><i class="fa-solid fa-xmark"></i></button>
            </div>
            
            <div class="drawer-body" id="cartItems">
                <!-- Items agregados -->
            </div>

            <div class="drawer-footer">
                <div class="form-group">
                    <label>Tu Nombre (Opcional)</label>
                    <input type="text" id="clientName" class="form-control" placeholder="Ej. Carlos">
                </div>
                <div class="form-group">
                    <label>Notas especiales para la cocina</label>
                    <input type="text" id="clientNotes" class="form-control" placeholder="Ej. Sin mayonesa, papas bien crujientes">
                </div>

                <div class="total-row">
                    <span>Total en Mesa:</span>
                    <span style="color: var(--secondary);" id="cartTotal">$0.00</span>
                </div>

                <button class="btn-send-order" onclick="sendOrderToWhatsApp()">
                    <i class="fa-brands fa-whatsapp"></i>
                    Enviar Pedido a Cocina por WhatsApp
                </button>
            </div>
        </div>
    </div>

    <!-- MODAL CAMBIAR MESA -->
    <div class="modal-overlay" id="tableModal">
        <div class="drawer-content">
            <div class="drawer-header">
                <h3><i class="fa-solid fa-chair" style="color: var(--secondary);"></i> Selecciona tu Mesa</h3>
                <button class="close-modal" onclick="closeTableSelector()"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="drawer-body">
                <div class="form-group">
                    <label>Número de Mesa:</label>
                    <select id="tableSelectDropdown" class="form-control" style="font-size: 1rem; padding: 12px;">
                        <option value="1">Mesa 1</option>
                        <option value="2">Mesa 2</option>
                        <option value="3">Mesa 3</option>
                        <option value="4">Mesa 4</option>
                        <option value="5">Mesa 5</option>
                        <option value="6">Mesa 6</option>
                        <option value="7">Mesa 7</option>
                        <option value="8">Mesa 8</option>
                        <option value="9">Mesa 9</option>
                        <option value="10">Mesa 10</option>
                    </select>
                </div>
                <button class="print-btn" onclick="confirmTableSelection()">Confirmar Mesa</button>
            </div>
        </div>
    </div>

    <!-- MODAL GENERADOR DE QR (ADMIN) -->
    <div class="modal-overlay" id="qrModal">
        <div class="drawer-content">
            <div class="drawer-header">
                <h3><i class="fa-solid fa-qrcode" style="color: var(--primary);"></i> Generar QR para Mesa</h3>
                <button class="close-modal" onclick="closeQRGenerator()"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="drawer-body">
                <div class="form-group">
                    <label>Selecciona la mesa para el código QR:</label>
                    <select id="qrTableSelect" class="form-control" onchange="generateQR()">
                        <option value="1">Mesa 1</option>
                        <option value="2">Mesa 2</option>
                        <option value="3">Mesa 3</option>
                        <option value="4">Mesa 4</option>
                        <option value="5">Mesa 5</option>
                        <option value="6">Mesa 6</option>
                        <option value="7">Mesa 7</option>
                        <option value="8">Mesa 8</option>
                        <option value="9">Mesa 9</option>
                        <option value="10">Mesa 10</option>
                    </select>
                </div>

                <div class="qr-card-print" id="printableQR">
                    <h2 style="color: #FF5232; font-weight: 800;">CHICK & CHIPS</h2>
                    <p style="font-weight: 600;">Escanea con tu celular para ver el menú</p>
                    <div id="qrcode"></div>
                    <div style="font-size: 1.2rem; font-weight: 800; background: #FF5232; color: white; padding: 4px 16px; border-radius: 8px; margin-top: 5px;" id="qrCardTableTitle">
                        MESA 1
                    </div>
                </div>

                <button class="print-btn" onclick="window.print()">
                    <i class="fa-solid fa-print"></i> Imprimir QR para la Mesa
                </button>
            </div>
        </div>
    </div>

    <script>
        // PIN DE ACCESO ADMINISTRADOR
        const ADMIN_PIN = "4381";

        // DATOS DEL MENÚ
        const menuProducts = [
            // PAPIPOLLO
            { id: 1, category: 'papipollo', name: 'Papipollo Tradicional', desc: 'Papas fritas + presa de pollo frito + salsas', price: 2.50, badge: 'Más vendido' },
            { id: 2, category: 'papipollo', name: 'Papipollo Pechuga', desc: 'Pechuga de pollo frito + papas + salsas', price: 2.50, badge: 'Recomendado' },
            // SALCHIPAPA
            { id: 3, category: 'salchipapa', name: 'Salchipapa Clásica', desc: 'Papas fritas + salchicha + salsas', price: 1.50, badge: 'Económico' },
            // HAMBURGUESA
            { id: 4, category: 'hamburguesa', name: 'Hamburguesa Tradicional', desc: 'Pan + tomate + lechuga + tocino + carne + salsas + papas', price: 2.00, badge: 'Clásica' },
            { id: 5, category: 'hamburguesa', name: 'Hamburguesa Completa', desc: 'Pan + tomate + doble tocino + carne + doble queso mozzarella + salsas + papas', price: 2.50, badge: 'Especial' },
            // BEBIDAS
            { id: 6, category: 'bebidas', name: 'Pepsi Personal', desc: 'Bebida refrescante personal', price: 0.50, badge: 'Fría' },
            { id: 7, category: 'bebidas', name: 'Coca Cola Personal', desc: 'Bebida refrescante personal', price: 0.50, badge: 'Fría' },
            { id: 8, category: 'bebidas', name: 'Sprite Personal', desc: 'Bebida refrescante personal', price: 0.50, badge: 'Fría' }
        ];

        let cart = [];
        let currentTable = "1";

        // DETECTAR PARÁMETRO MESA EN URL (?mesa=2)
        function initTableFromURL() {
            const urlParams = new URLSearchParams(window.location.search);
            const tableParam = urlParams.get('mesa');
            if (tableParam) {
                currentTable = tableParam;
            }
            updateTableDisplay();
        }

        function updateTableDisplay() {
            document.getElementById('currentTableDisplay').textContent = `Mesa ${currentTable}`;
            document.getElementById('cartModalTable').textContent = `Mesa ${currentTable}`;
        }

        // RENDERIZAR MENÚ
        function renderMenu(category = 'todos') {
            const container = document.getElementById('menuGrid');
            container.innerHTML = '';

            const filtered = category === 'todos' 
                ? menuProducts 
                : menuProducts.filter(p => p.category === category);

            filtered.forEach(p => {
                const item = document.createElement('div');
                item.className = 'product-item';
                item.innerHTML = `
                    <div class="product-details">
                        <div class="product-header">
                            <span class="product-title">${p.name}</span>
                            <span class="product-badge">${p.badge}</span>
                        </div>
                        <div class="product-desc">${p.desc}</div>
                        <div class="product-price">$${p.price.toFixed(2)}</div>
                    </div>
                    <button class="add-btn" onclick="addToCart(${p.id})">
                        <i class="fa-solid fa-plus"></i>
                    </button>
                `;
                container.appendChild(item);
            });
        }

        // FILTRAR CATEGORÍAS
        function filterMenu(cat, btn) {
            document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderMenu(cat);
        }

        // CARRITO
        function addToCart(productId) {
            const product = menuProducts.find(p => p.id === productId);
            const item = cart.find(i => i.id === productId);

            if (item) {
                item.quantity++;
            } else {
                cart.push({ ...product, quantity: 1 });
            }

            updateCartUI();
        }

        function changeQty(productId, delta) {
            const item = cart.find(i => i.id === productId);
            if (!item) return;

            item.quantity += delta;
            if (item.quantity <= 0) {
                cart = cart.filter(i => i.id !== productId);
            }

            updateCartUI();
        }

        function updateCartUI() {
            const cartItemsContainer = document.getElementById('cartItems');
            const cartBadge = document.getElementById('cartBadge');
            const cartTotal = document.getElementById('cartTotal');
            const floatCount = document.getElementById('floatCount');
            const floatTotal = document.getElementById('floatTotal');
            const floatingBar = document.getElementById('floatingCart');

            const totalItems = cart.reduce((sum, item) => sum + item.quantity, 0);
            const totalPrice = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);

            cartBadge.textContent = totalItems;
            floatCount.textContent = `${totalItems} item${totalItems !== 1 ? 's' : ''}`;
            floatTotal.textContent = `$${totalPrice.toFixed(2)}`;
            cartTotal.textContent = `$${totalPrice.toFixed(2)}`;

            if (totalItems > 0) {
                floatingBar.classList.add('visible');
            } else {
                floatingBar.classList.remove('visible');
            }

            if (cart.length === 0) {
                cartItemsContainer.innerHTML = `
                    <div class="cart-empty">
                        <i class="fa-solid fa-utensils"></i>
                        <p>Aún no has agregado platos</p>
                    </div>
                `;
                return;
            }

            cartItemsContainer.innerHTML = cart.map(item => `
                <div class="cart-item">
                    <div class="cart-item-info">
                        <h4>${item.name}</h4>
                        <span>$${(item.price * item.quantity).toFixed(2)}</span>
                    </div>
                    <div class="qty-controls">
                        <button class="qty-btn" onclick="changeQty(${item.id}, -1)">-</button>
                        <span>${item.quantity}</span>
                        <button class="qty-btn" onclick="changeQty(${item.id}, 1)">+</button>
                    </div>
                </div>
            `).join('');
        }

        function toggleCart() {
            document.getElementById('cartModal').classList.toggle('open');
        }

        // CONTROL DE AUTENTICACIÓN ADMIN
        function openAuthModal() {
            document.getElementById('pinInput').value = '';
            document.getElementById('pinError').style.display = 'none';
            document.getElementById('authModal').classList.add('open');
        }

        function closeAuthModal() {
            document.getElementById('authModal').classList.remove('open');
        }

        function verifyPin() {
            const inputPin = document.getElementById('pinInput').value;
            if (inputPin === ADMIN_PIN) {
                closeAuthModal();
                openQRGenerator();
            } else {
                document.getElementById('pinError').style.display = 'block';
            }
        }

        // CAMBIO DE MESA
        function openTableSelector() {
            document.getElementById('tableSelectDropdown').value = currentTable;
            document.getElementById('tableModal').classList.add('open');
        }

        function closeTableSelector() {
            document.getElementById('tableModal').classList.remove('open');
        }

        function confirmTableSelection() {
            currentTable = document.getElementById('tableSelectDropdown').value;
            updateTableDisplay();
            closeTableSelector();
        }

        // GENERADOR DE CÓDIGOS QR PARA IMPRIMIR EN MESAS
        let qrcodeObj = null;

        function openQRGenerator() {
            document.getElementById('qrModal').classList.add('open');
            generateQR();
        }

        function closeQRGenerator() {
            document.getElementById('qrModal').classList.remove('open');
        }

        function generateQR() {
            const tableNum = document.getElementById('qrTableSelect').value;
            document.getElementById('qrCardTableTitle').textContent = `MESA ${tableNum}`;

            const baseUrl = window.location.href.split('?')[0];
            const targetUrl = `${baseUrl}?mesa=${tableNum}`;

            const qrContainer = document.getElementById('qrcode');
            qrContainer.innerHTML = '';

            qrcodeObj = new QRCode(qrContainer, {
                text: targetUrl,
                width: 160,
                height: 160,
                colorDark : "#000000",
                colorLight : "#ffffff",
                correctLevel : QRCode.CorrectLevel.H
            });
        }

        // ENVIAR PEDIDO POR WHATSAPP
        function sendOrderToWhatsApp() {
            if (cart.length === 0) {
                alert('Añade al menos un producto al carrito antes de hacer tu pedido.');
                return;
            }

            const name = document.getElementById('clientName').value.trim();
            const notes = document.getElementById('clientNotes').value.trim();
            const phone = "593982565003";

            let message = `🍗 *NUEVO PEDIDO EN MESA - CHICK & CHIPS* 🍟\n\n`;
            message += `🪑 *MESA NUMERO:* ${currentTable}\n`;
            if (name) message += `👤 *Cliente:* ${name}\n`;
            if (notes) message += `📝 *Notas para cocina:* ${notes}\n`;
            message += `\n*Detalle del Pedido:*\n`;

            cart.forEach(item => {
                message += `• ${item.quantity}x ${item.name} - $${(item.price * item.quantity).toFixed(2)}\n`;
            });

            const total = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
            message += `\n💰 *TOTAL A PAGAR:* $${total.toFixed(2)}\n\n`;
            message += `Por favor preparar el pedido para la Mesa ${currentTable}. ¡Muchas gracias!`;

            const encodedMessage = encodeURIComponent(message);
            const whatsappUrl = `https://wa.me/${phone}?text=${encodedMessage}`;

            window.open(whatsappUrl, '_blank');
        }

        // INICIALIZACIÓN
        initTableFromURL();
        renderMenu();
    </script>
</body>
</html>
