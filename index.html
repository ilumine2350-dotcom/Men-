<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chick & Chips | Menú Digital en Mesa</title>
  <!-- FontAwesome para Íconos -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Google Font 'Plus Jakarta Sans' -->
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  
  <style>
    :root {
      /* PALETA PROVOCATIVA Y JUVENIL (Estímulo de Apetito) */
      --bg-color: #FFF9F5;              /* Crema suave muy cálido */
      --card-bg: #FFFFFF;
      --header-bg: #140E0B;            /* Carbón intenso para contraste supremo */
      
      --primary: #FF3B1D;              /* Naranja/Rojo fuego hiper-vibrante */
      --primary-gradient: linear-gradient(135deg, #FF5E36 0%, #E6280C 100%);
      --primary-glow: rgba(255, 59, 29, 0.35);
      --primary-glass: rgba(255, 59, 29, 0.08);
      --primary-border: rgba(255, 59, 29, 0.2);

      --accent-gold: #FFB800;          /* Dorado crujiente */
      --accent-gold-gradient: linear-gradient(135deg, #FFD043 0%, #FF9900 100%);
      --accent-gold-glow: rgba(255, 184, 0, 0.4);

      --text-dark: #1F140E;
      --text-muted: #8A7B73;
      --border-color: rgba(255, 59, 29, 0.08);
      --shadow-card: 0 10px 30px rgba(255, 59, 29, 0.05), 0 2px 8px rgba(0, 0, 0, 0.02);
      --shadow-float: 0 14px 35px rgba(255, 59, 29, 0.3);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-dark);
      padding-bottom: 120px;
    }

    /* ENCABEZADO IMPACTANTE */
    header {
      background: var(--header-bg);
      padding: 22px 16px 20px;
      text-align: center;
      border-bottom-left-radius: 32px;
      border-bottom-right-radius: 32px;
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.2);
      position: sticky;
      top: 0;
      z-index: 80;
    }

    .brand-logo {
      max-width: 185px;
      width: 100%;
      height: auto;
      display: block;
      margin: 0 auto;
      filter: drop-shadow(0px 6px 15px rgba(255, 59, 29, 0.3));
      transition: transform 0.3s ease;
    }

    .brand-logo:active {
      transform: scale(0.97);
    }

    .table-badge-header {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(255, 255, 255, 0.1);
      color: var(--accent-gold);
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 800;
      margin-top: 12px;
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 184, 0, 0.3);
      box-shadow: 0 0 15px rgba(255, 184, 0, 0.15);
    }

    /* BOTONES DE CATEGORÍAS VIBRANTES Y TRANSLÚCIDOS */
    .categories-container {
      padding: 20px 16px 8px;
      max-width: 550px;
      margin: 0 auto;
    }

    .categories-title {
      font-size: 11px;
      font-weight: 900;
      color: var(--primary);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .categories {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding-bottom: 8px;
      scrollbar-width: none;
    }

    .categories::-webkit-scrollbar {
      display: none;
    }

    .cat-btn {
      background: rgba(255, 255, 255, 0.85);
      color: var(--text-dark);
      border: 1px solid rgba(255, 59, 29, 0.12);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: 11px 20px;
      border-radius: 30px;
      font-size: 13.5px;
      font-weight: 800;
      white-space: nowrap;
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.03);
    }

    .cat-btn.active {
      background: var(--primary-gradient);
      color: #ffffff;
      border-color: transparent;
      box-shadow: 0 8px 22px var(--primary-glow);
      transform: translateY(-2px) scale(1.02);
    }

    .cat-btn:hover:not(.active) {
      background: #FFFFFF;
      border-color: var(--primary);
      color: var(--primary);
    }

    /* CONTENEDOR Y TARJETAS DE PRODUCTO */
    .container {
      padding: 10px 16px 20px;
      max-width: 550px;
      margin: 0 auto;
    }

    .product-card {
      background: var(--card-bg);
      border-radius: 24px;
      padding: 18px;
      margin-bottom: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border: 1px solid var(--border-color);
      box-shadow: var(--shadow-card);
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
      overflow: hidden;
    }

    .product-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 4px;
      height: 100%;
      background: var(--primary-gradient);
      opacity: 0;
      transition: opacity 0.25s ease;
    }

    .product-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 14px 32px rgba(255, 59, 29, 0.12);
      border-color: var(--primary-border);
    }

    .product-card:hover::before {
      opacity: 1;
    }

    .product-info {
      flex: 1;
      padding-right: 14px;
    }

    .product-title {
      font-size: 16.5px;
      font-weight: 800;
      color: var(--text-dark);
      margin-bottom: 4px;
    }

    .product-desc {
      font-size: 12.5px;
      color: var(--text-muted);
      margin-bottom: 12px;
      line-height: 1.45;
      font-weight: 500;
    }

    .product-price {
      font-size: 17.5px;
      font-weight: 900;
      color: var(--primary);
      display: inline-block;
      background: var(--primary-glass);
      padding: 5px 14px;
      border-radius: 20px;
      border: 1px solid var(--primary-border);
    }

    /* BOTÓN DE AÑADIR TRANSPARENTE Y PROVOCATIVO */
    .add-btn {
      background: var(--primary-glass);
      color: var(--primary);
      border: 1.5px solid var(--primary-border);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      padding: 10px 18px;
      border-radius: 18px;
      font-weight: 800;
      font-size: 13px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .add-btn:hover, .add-btn:active {
      background: var(--primary-gradient);
      color: #ffffff;
      border-color: transparent;
      box-shadow: 0 6px 20px var(--primary-glow);
      transform: scale(1.05);
    }

    /* BARRA INFERIOR FLOTANTE ESTILO APP VIP */
    .cart-bar {
      position: fixed;
      bottom: 20px;
      left: 16px;
      right: 16px;
      max-width: 518px;
      margin: 0 auto;
      background: var(--accent-gold-gradient);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      color: var(--text-dark);
      border-radius: 26px;
      padding: 15px 22px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 12px 35px var(--accent-gold-glow);
      cursor: pointer;
      z-index: 90;
      font-weight: 900;
      border: 1.5px solid rgba(255, 255, 255, 0.6);
      transition: all 0.25s ease;
    }

    .cart-bar:active {
      transform: scale(0.97);
    }

    .cart-bar-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .cart-count {
      background: var(--header-bg);
      color: #ffffff;
      font-weight: 900;
      padding: 5px 12px;
      border-radius: 16px;
      font-size: 13px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    }

    /* MODAL DE CHECKOUT EN MESA */
    .modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(20, 14, 11, 0.7);
      display: none;
      justify-content: center;
      align-items: flex-end;
      z-index: 100;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    .modal.open {
      display: flex;
    }

    .modal-content {
      background: #FFFFFF;
      width: 100%;
      max-width: 550px;
      border-radius: 36px 36px 0 0;
      max-height: 88vh;
      overflow-y: auto;
      padding: 28px 22px;
      color: var(--text-dark);
      box-shadow: 0 -10px 45px rgba(0,0,0,0.2);
      animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes slideUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 16px;
      margin-bottom: 18px;
    }

    .modal-title {
      font-size: 19px;
      font-weight: 900;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .close-btn {
      background: rgba(0,0,0,0.05);
      border: none;
      color: var(--text-muted);
      width: 36px;
      height: 36px;
      border-radius: 50%;
      font-size: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
    }

    .close-btn:hover {
      background: rgba(0,0,0,0.1);
    }

    .cart-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 13px 0;
      border-bottom: 1px solid var(--border-color);
    }

    .cart-item-title {
      font-size: 14.5px;
      font-weight: 800;
    }

    .cart-item-price {
      font-size: 13px;
      color: var(--primary);
      font-weight: 800;
    }

    .quantity-controls {
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--bg-color);
      padding: 5px 10px;
      border-radius: 14px;
      border: 1px solid var(--border-color);
    }

    .qty-btn {
      background: #FFFFFF;
      border: 1px solid rgba(0,0,0,0.08);
      color: var(--text-dark);
      width: 28px;
      height: 28px;
      border-radius: 10px;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
    }

    .qty-btn:active {
      background: var(--primary-glass);
      color: var(--primary);
    }

    .form-row {
      display: flex;
      gap: 12px;
    }

    .form-group {
      margin-top: 16px;
      flex: 1;
    }

    .form-group label {
      display: block;
      font-size: 11px;
      color: var(--text-muted);
      margin-bottom: 6px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.6px;
    }

    .form-control {
      width: 100%;
      background: var(--bg-color);
      border: 1.5px solid var(--border-color);
      padding: 14px 16px;
      border-radius: 16px;
      color: var(--text-dark);
      font-size: 14px;
      font-weight: 700;
      transition: border-color 0.2s;
    }

    .form-control:focus {
      outline: none;
      border-color: var(--primary);
      background: #FFFFFF;
    }

    .cart-summary {
      margin-top: 22px;
      padding-top: 16px;
      border-top: 2px dashed var(--border-color);
    }

    .summary-total {
      font-size: 19px;
      font-weight: 900;
      display: flex;
      justify-content: space-between;
    }

    .btn-send-wa {
      background: #25D366;
      color: #FFFFFF;
      width: 100%;
      border: none;
      padding: 16px;
      border-radius: 20px;
      font-size: 16px;
      font-weight: 900;
      margin-top: 20px;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      box-shadow: 0 10px 28px rgba(37, 211, 102, 0.4);
      transition: all 0.2s ease;
    }

    .btn-send-wa:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 32px rgba(37, 211, 102, 0.5);
    }

    .btn-send-wa:active {
      transform: scale(0.98);
    }
  </style>
</head>
<body>

  <!-- ENCABEZADO CON LOGO Y BADGE DE MESA -->
  <header>
    <img src="logo.png" alt="Chick & Chips" class="brand-logo">
    <div class="table-badge-header">
      <i class="fa-solid fa-fire"></i> MENÚ DIGITAL DE MESA
    </div>
  </header>

  <!-- BOTONES DE CATEGORÍAS -->
  <div class="categories-container">
    <span class="categories-title"><i class="fa-solid fa-bolt"></i> ¿Qué se te antoja hoy?</span>
    <div class="categories">
      <button class="cat-btn active" onclick="filterCategory('papipollo', this)">🍗 Papi Pollo</button>
      <button class="cat-btn" onclick="filterCategory('salchipapa', this)">🍟 Salchipapas</button>
      <button class="cat-btn" onclick="filterCategory('hamburguesas', this)">🍔 Hamburguesas</button>
      <button class="cat-btn" onclick="filterCategory('extras', this)">🥤 Extras & Bebidas</button>
    </div>
  </div>

  <!-- CONTENEDOR DE PRODUCTOS -->
  <div class="container" id="menuContainer"></div>

  <!-- BARRA DE CARRITO FLOTANTE -->
  <div class="cart-bar" id="cartBar" style="display: none;" onclick="openCartModal()">
    <div class="cart-bar-info">
      <span class="cart-count" id="cartBadge">0</span>
      <span>Enviar Pedido a Cocina</span>
    </div>
    <div id="cartBarTotal" style="font-size: 17px;">$0.00</div>
  </div>

  <!-- MODAL DE CHECKOUT EN MESA -->
  <div class="modal" id="cartModal">
    <div class="modal-content">
      <div class="modal-header">
        <div class="modal-title">
          <i class="fa-solid fa-utensils" style="color: var(--primary);"></i> Confirma tu Pedido
        </div>
        <button class="close-btn" onclick="closeCartModal()">&times;</button>
      </div>

      <div id="cartItemsList"></div>

      <div class="form-row">
        <div class="form-group" style="flex: 0.7;">
          <label>🪑 N° de Mesa *</label>
          <input type="number" id="tableNumber" class="form-control" placeholder="Ej: 3" min="1">
        </div>
        <div class="form-group" style="flex: 1.3;">
          <label>👤 Tu Nombre (Opcional)</label>
          <input type="text" id="clientName" class="form-control" placeholder="Ej: Mateo">
        </div>
      </div>

      <div class="form-group">
        <label>📝 Indicaciones para cocina (Opcional)</label>
        <input type="text" id="orderNotes" class="form-control" placeholder="Ej: Papas bien crujientes, sin Mayonesa">
      </div>

      <div class="form-group">
        <label>💳 Método de Pago al recibir</label>
        <select id="paymentMethod" class="form-control">
          <option value="Efectivo en Mesa / Caja">Efectivo en Mesa</option>
          <option value="Transferencia / Deuna">Transferencia / Deuna</option>
          <option value="Tarjeta de Débito/Crédito">Tarjeta</option>
        </select>
      </div>

      <div class="cart-summary">
        <div class="summary-total">
          <span>Total a pagar:</span>
          <span id="totalAmount" style="color: var(--primary);">$0.00</span>
        </div>
      </div>

      <button class="btn-send-wa" onclick="sendOrderToWhatsApp()">
        <i class="fa-brands fa-whatsapp fa-xl"></i> ENVIAR A COCINA AHORA
      </button>
    </div>
  </div>

  <!-- JAVASCRIPT -->
  <script>
    // ⚙️ NÚMERO DE WHATSAPP
    const WHATSAPP_PHONE = "593982565003";

    // PRODUCTOS
    const products = [
      { id: 1, category: 'papipollo', name: 'Papi Pollo', desc: 'porción grande de papas + presa de pollo + 3 salsa', price: 2.50 },
      { id: 2, category: 'papipollo', name: 'Popcron + papas', desc: 'popcron de pechuga de pollo + papas pequeña + 3 salsas', price: 2.00 },
      { id: 3, category: 'salchipapa', name: 'Salchipapa', desc: 'porción mediana de papas + salchichas fritas + 2 salsas', price: 1.50 },
      { id: 4, category: 'hamburguesas', name: 'Hamburguesa Normal', desc: 'hamburguesa normal + porción pequeña de papas + 3 salsas.', price: 2.00 },
      { id: 5, category: 'hamburguesas', name: 'Hamburguesa Completa', desc: 'hamburguesa con huevo frito y tocino + porción mediana de papas + 3 salsas + bebida.', price: 3.50 },
      { id: 6, category: 'extras', name: 'Bebida personal Coca-Cola', desc: 'Bebida helada personal', price: 0.50 },
      { id: 7, category: 'extras', name: 'Bebida personal Sprite', desc: 'Bebida helada personal', price: 0.50 },
      { id: 8, category: 'extras', name: 'Bebida personal Pepsi', desc: 'Bebida helada personal', price: 0.50 },
      { id: 9, category: 'extras', name: 'Bebida personal Fioravanti', desc: 'Bebida helada personal', price: 0.50 },
      { id: 10, category: 'extras', name: 'Bebida personal Fanta', desc: 'Bebida helada personal', price: 0.50 },
      { id: 11, category: 'extras', name: 'Presa de Pollo - Pierna', desc: 'Pierna de pollo dorada y sazonada.', price: 1.50 },
      { id: 12, category: 'extras', name: 'Presa de Pollo - Pos Pierna', desc: 'Pos pierna de pollo dorada y sazonada.', price: 1.50 },
      { id: 13, category: 'extras', name: 'Popcron', desc: 'popcron de pechuga de pollo frita', price: 1.50 },
      { id: 14, category: 'extras', name: 'Mayonesa', desc: 'Salsa cremosa de mayonesa.', price: 0.30 },
      { id: 15, category: 'extras', name: 'Salsa de Tomate', desc: 'Salsa clásica de tomate.', price: 0.30 },
      { id: 16, category: 'extras', name: 'Salsa de la Casa', desc: 'Sabor especial secreto de la casa.', price: 0.30 }
    ];

    let cart = [];

    // DETECTAR PARÁMETRO DE MESA EN LA URL
    window.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      const mesaParam = urlParams.get('mesa');
      if (mesaParam) {
        document.getElementById('tableNumber').value = mesaParam;
      }
      renderProducts('papipollo');
    });

    function renderProducts(filter = 'papipollo') {
      const container = document.getElementById('menuContainer');
      container.innerHTML = '';

      const filtered = products.filter(p => p.category === filter);

      filtered.forEach(p => {
        container.innerHTML += `
          <div class="product-card">
            <div class="product-info">
              <div class="product-title">${p.name}</div>
              <div class="product-desc">${p.desc}</div>
              <div class="product-price">$${p.price.toFixed(2)}</div>
            </div>
            <button class="add-btn" onclick="addToCart(${p.id})">
              <i class="fa-solid fa-plus"></i> Añadir
            </button>
          </div>
        `;
      });
    }

    function filterCategory(cat, btn) {
      document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderProducts(cat);
    }

    function addToCart(productId) {
      const product = products.find(p => p.id === productId);
      const itemInCart = cart.find(item => item.id === productId);

      if (itemInCart) {
        itemInCart.qty += 1;
      } else {
        cart.push({ ...product, qty: 1 });
      }

      updateCartUI();
    }

    function changeQuantity(productId, delta) {
      const item = cart.find(p => p.id === productId);
      if (!item) return;

      item.qty += delta;
      if (item.qty <= 0) {
        cart = cart.filter(p => p.id !== productId);
      }
      updateCartUI();
    }

    function updateCartUI() {
      const totalCount = cart.reduce((sum, item) => sum + item.qty, 0);
      const totalPrice = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);

      const cartBar = document.getElementById('cartBar');
      if (totalCount > 0) {
        cartBar.style.display = 'flex';
        document.getElementById('cartBadge').innerText = totalCount;
        document.getElementById('cartBarTotal').innerText = `$${totalPrice.toFixed(2)}`;
      } else {
        cartBar.style.display = 'none';
        closeCartModal();
      }

      renderCartModalItems();
    }

    function renderCartModalItems() {
      const container = document.getElementById('cartItemsList');
      container.innerHTML = '';

      let totalPrice = 0;

      cart.forEach(item => {
        const itemTotal = item.price * item.qty;
        totalPrice += itemTotal;

        container.innerHTML += `
          <div class="cart-item">
            <div>
              <div class="cart-item-title">${item.name}</div>
              <div class="cart-item-price">$${item.price.toFixed(2)} c/u</div>
            </div>
            <div class="quantity-controls">
              <button class="qty-btn" onclick="changeQuantity(${item.id}, -1)">-</button>
              <span style="font-weight:900; font-size:14px;">${item.qty}</span>
              <button class="qty-btn" onclick="changeQuantity(${item.id}, 1)">+</button>
            </div>
          </div>
        `;
      });

      document.getElementById('totalAmount').innerText = `$${totalPrice.toFixed(2)}`;
    }

    function openCartModal() {
      document.getElementById('cartModal').classList.add('open');
    }

    function closeCartModal() {
      document.getElementById('cartModal').classList.remove('open');
    }

    function sendOrderToWhatsApp() {
      if (cart.length === 0) return;

      const table = document.getElementById('tableNumber').value.trim();
      const name = document.getElementById('clientName').value.trim() || 'Cliente en mesa';
      const notes = document.getElementById('orderNotes').value.trim();
      const payment = document.getElementById('paymentMethod').value;

      if (!table) {
        alert("Por favor, ingresa el número de mesa en el que te encuentras.");
        return;
      }

      let totalPrice = 0;
      let orderDetails = "";

      cart.forEach((item, index) => {
        const itemTotal = item.price * item.qty;
        totalPrice += itemTotal;
        orderDetails += `${index + 1}. *${item.qty}x* ${item.name} -> $${itemTotal.toFixed(2)}\n`;
      });

      let message = 
        `🔥 *PEDIDO EN MESA - CHICK & CHIPS* 🍗\n\n` +
        `🪑 *MESA NÚMERO:* ${table}\n` +
        `👤 *Cliente:* ${name}\n` +
        `💳 *Método de Pago:* ${payment}\n`;

      if (notes) {
        message += `📝 *Notas:* ${notes}\n`;
      }

      message += 
        `\n🛒 *DETALLE DEL PEDIDO:*\n${orderDetails}\n` +
        `💰 *TOTAL A PAGAR:* $${totalPrice.toFixed(2)}\n\n` +
        `¡Favor preparar el pedido para la Mesa ${table}!`;

      const whatsappUrl = `https://wa.me/${WHATSAPP_PHONE}?text=${encodeURIComponent(message)}`;
      window.open(whatsappUrl, '_blank');
    }
  </script>
</body>
</html>
